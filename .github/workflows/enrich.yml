name: Public records
# Runs just the public-record source steps (also part of the full pipeline) so changes to them
# show results in minutes rather than after the whole data load.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 11 * * *"   # daily: paid steps continue (within their caps) and collect AI batches
  push:
    branches: [main]
    paths: ["etl/enrich.py", "etl/sources.txt", "etl/sources_quick.txt", "etl/irs990.py", "etl/irs990_people.py", "etl/website_profile.py", "etl/people_search.py", "etl/owner_search.py", "etl/linkedin.py", "etl/sec.py", "etl/banks.py", "etl/sba_loans.py",
            "etl/contracts.py", "etl/fmcsa.py", "etl/osha.py", "etl/founded.py", "etl/signals.py", "etl/valuation.py",
            ".github/workflows/enrich.yml"]
permissions:
  contents: write
# A new run waits for the current one rather than cancelling it: paid steps (AI, web search) may be
# mid-way, and their results are only saved as each batch completes.
concurrency:
  group: enrich
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: enrich-${{ github.run_id }}
          restore-keys: enrich-
      - run: |
          mkdir -p data/cache
          python etl/migrate.py
          python etl/margins.py --fetch || echo "IRS margins unavailable"
          python etl/adjust.py --fetch || echo "Inflation/growth figures unavailable"
          # One module per line in etl/sources.txt (or just those in etl/sources_quick.txt while
          # developing one); each is non-fatal.
          list=etl/sources.txt
          if [ -s etl/sources_quick.txt ]; then
            list=etl/sources_quick.txt
            export WEBSITE_PROFILE_LIMIT=${WEBSITE_PROFILE_LIMIT:-300}   # quick runs are small pilots
          fi
          for m in $(grep -v '^#' "$list" | awk '{print $1}'); do
            echo "=== $m"
            python "etl/$m.py" --state OK || echo "$m failed (non-fatal)"
          done 2>&1 | tee "$RUNNER_TEMP/enrich.log"
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          OWNER_SEARCH_MAX_TOTAL: ${{ vars.OWNER_SEARCH_MAX_TOTAL }}
          LINKEDIN_MAX_TOTAL: ${{ vars.LINKEDIN_MAX_TOTAL }}
      - if: always()
        run: |
          cd "$RUNNER_TEMP" && mkdir logs && cd logs && git init -q -b enrich-logs
          cp "$RUNNER_TEMP/enrich.log" enrich.log 2>/dev/null || echo none > enrich.log
          git add enrich.log && git -c user.name=etl-bot -c user.email=etl-bot@users.noreply.github.com commit -qm log
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" enrich-logs
