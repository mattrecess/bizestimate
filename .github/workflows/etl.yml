name: Load PPP data
on:
  workflow_dispatch:
    inputs:
      state:
        description: Two-letter state code
        default: OK
  # Daily run: picks up more Geocodio rooftop lookups within the free allowance.
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
    paths: ["etl/**", "db/**", ".github/workflows/etl.yml"]
permissions:
  contents: write
  actions: read
# A new run waits for the current one instead of cancelling it: a full load takes over an hour, and
# a push part-way through used to throw that work away.
concurrency:
  group: etl
  cancel-in-progress: false
jobs:
  # GitHub often skips or delays scheduled runs, so the site's daily cron (Vercel, /api/cron/daily) starts
  # this too. A scheduled run that finds one already started in the last 12 hours does nothing.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/etl.yml/runs?created=>$since&per_page=20" \
                --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .conclusion != \"cancelled\")] | length")
          echo "runs in the last 12 hours: $n"
          [ "$n" = "0" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
  etl:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r etl/requirements.txt
      # Keep geocoding/owner results between runs so only new items are looked up.
      # Do NOT edit this path list: the cache's version is derived from it, so any change orphans
      # every saved result. New cache files go in data/cache/ (next step) instead.
      - uses: actions/cache@v4
        with:
          path: |
            data/geocode_cache.csv
            data/rooftop_cache.csv
            data/owners_cache.csv
            data/owners_ai_cache.csv
            data/owners_ai_pending.json
            data/website_check_cache.json
          key: geocode-${{ github.run_id }}
          restore-keys: geocode-
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: etl-cache-${{ github.run_id }}
          restore-keys: etl-cache-
      - name: Run pipeline
        run: |
          set -o pipefail
          ./etl/run.sh "${{ inputs.state || 'OK' }}" --addresses 2>&1 | tee "$RUNNER_TEMP/etl.log"
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          GEOCODIO_API_KEY: ${{ secrets.GEOCODIO_API_KEY }}
          GEOCODIO_DAILY_LIMIT: ${{ vars.GEOCODIO_DAILY_LIMIT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNERS_AI_MAX_TOTAL: ${{ vars.OWNERS_AI_MAX_TOTAL }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OWNERS_SEARCH_MAX_TOTAL: ${{ vars.OWNERS_SEARCH_MAX_TOTAL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      # Publish the log to the etl-logs branch so it can be read without signing in.
      - name: Publish log
        if: always()
        run: |
          cd "$RUNNER_TEMP" && mkdir logs && cd logs && git init -q -b etl-logs
          echo "run ${{ github.run_id }} (${{ github.sha }}): ${{ job.status }}" > etl.log
          cat "$RUNNER_TEMP/etl.log" >> etl.log 2>/dev/null || true
          git add etl.log && git -c user.name=etl-bot -c user.email=etl-bot@users.noreply.github.com commit -qm log
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" etl-logs
