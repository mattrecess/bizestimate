name: Fetch probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/fetch_probe.py", ".github/workflows/fetch-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - run: python tools/fetch_probe.py 2>&1 | tee "$RUNNER_TEMP/fetch.log"
      - if: always()
        run: |
          cd "$RUNNER_TEMP" && mkdir logs && cd logs && git init -q -b fetch-logs
          cp "$RUNNER_TEMP/fetch.log" fetch.log 2>/dev/null || echo none > fetch.log
          git add fetch.log && git -c user.name=etl-bot -c user.email=etl-bot@users.noreply.github.com commit -qm log
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" fetch-logs
