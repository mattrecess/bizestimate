name: Site check
# After each successful production deploy on Vercel (and daily), load the main pages and APIs and
# fail if any is broken or very slow; Run alerts then opens an issue.
on:
  deployment_status:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/site_check.py "${{ github.event.deployment_status.environment_url || 'https://bizestimate-six.vercel.app' }}" 2>&1 | tee "$RUNNER_TEMP/check.log"; exit ${PIPESTATUS[0]}
        shell: bash
      # Published like the other logs so it can be read without signing in.
      - if: always()
        run: |
          cd "$RUNNER_TEMP" && mkdir logs && cd logs && git init -q -b check-logs
          cp "$RUNNER_TEMP/check.log" check.log 2>/dev/null || echo none > check.log
          git add check.log && git -c user.name=etl-bot -c user.email=etl-bot@users.noreply.github.com commit -qm log
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" check-logs
