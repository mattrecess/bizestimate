name: Run alerts
# Opens a GitHub issue when a data run fails (GitHub emails the repository's watchers about new
# issues), adds a comment if it fails again, and closes it once the same workflow succeeds.
on:
  workflow_run:
    workflows: ["Load PPP data", "Public records", "Form 5500 headcounts"]
    types: [completed]
permissions:
  issues: write
jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          URL: ${{ github.event.workflow_run.html_url }}
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          label="run-failure"
          gh label create "$label" --color B60205 --description "A data run failed" 2>/dev/null || true
          issue=$(gh issue list --label "$label" --state open --search "\"$NAME\" in:title" --json number,title \
                  --jq "map(select(.title == \"Data run failed: $NAME\")) | .[0].number // empty")
          if [ "$RESULT" = "failure" ]; then
            body="The **$NAME** run failed: $URL ($TITLE). The log is on the workflow page and on the run's log branch."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Failed again: $URL"
            else
              gh issue create --title "Data run failed: $NAME" --label "$label" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Fixed: the next run succeeded ($URL)."
          fi
